<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACG WALL · 动漫壁纸</title>
<!-- 预连接加速 -->
<link rel="preconnect" href="https://api.lqbby.com">
<link rel="preconnect" href="https://t.alcy.cc">
<link rel="preconnect" href="https://api.ixiaowai.cn">
<link rel="preconnect" href="https://uapis.cn">
<link rel="preconnect" href="https://www.dmoe.cc">
<style>
:root{--bg:#05060a;--text:#f0f4f8;--muted:#7d8899;--cyan:#64d2ff;--violet:#bf5af2;--pink:#ff375f;--border:rgba(255,255,255,.1);--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.aurora{position:fixed;inset:-20%;z-index:-2;pointer-events:none;filter:blur(90px);opacity:.5}
.blob{position:absolute;border-radius:50%;mix-blend-mode:screen}
.blob:nth-child(1){width:50vmax;height:50vmax;left:-10%;top:-10%;background:radial-gradient(circle,rgba(59,130,246,.5),transparent 70%);animation:d1 24s ease-in-out infinite alternate}
.blob:nth-child(2){width:44vmax;height:44vmax;right:-10%;top:20%;background:radial-gradient(circle,rgba(139,92,246,.45),transparent 70%);animation:d2 28s ease-in-out infinite alternate}
.blob:nth-child(3){width:40vmax;height:40vmax;left:30%;bottom:-15%;background:radial-gradient(circle,rgba(6,182,212,.4),transparent 70%);animation:d3 32s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12%,8%) scale(1.2)}}
@keyframes d2{to{transform:translate(-10%,15%) scale(1.1)}}
@keyframes d3{to{transform:translate(6%,-12%) scale(1.25)}}
header{position:sticky;top:0;z-index:100;padding:28px 6vw 20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;background:linear-gradient(180deg,rgba(5,6,10,.92),transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
h1{font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:-.03em}
h1 span{background:linear-gradient(115deg,#fff 15%,var(--cyan) 45%,var(--violet) 75%,var(--pink) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gf 8s ease-in-out infinite alternate}
@keyframes gf{to{background-position:100% 0}}
.sub{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.06em}
.actions{display:flex;gap:10px}
.btn{padding:11px 24px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;transition:.4s var(--ease);font-family:inherit;display:flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-2px);border-color:rgba(100,210,255,.4)}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#05060a;border:none}
.btn-primary:hover{box-shadow:0 10px 36px rgba(100,210,255,.4)}
.btn:disabled{opacity:.5;cursor:wait}
.btn .spin{width:13px;height:13px;border:1.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none}
.btn.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:10px 6vw 60px;max-width:1600px;margin:0 auto}
@media(max-width:1100px){.gallery{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.gallery{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 4vw 40px}}
.tile{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(135deg,rgba(100,210,255,.12),rgba(191,90,242,.12));cursor:pointer;opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease),box-shadow .5s,border-color .5s}
.tile.show{opacity:1;transform:translateY(0)}
.tile:hover{border-color:rgba(100,210,255,.45);box-shadow:0 20px 50px rgba(0,0,0,.6);transform:translateY(-4px) scale(1.01)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease),opacity .5s;opacity:0}
.tile img.loaded{opacity:1}
.tile:hover img{transform:scale(1.06)}
.tile-num{position:absolute;top:10px;left:12px;font-size:11px;color:rgba(255,255,255,.5);font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.8);z-index:2}
.tile-tag{position:absolute;bottom:10px;left:12px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);text-shadow:0 2px 8px rgba(0,0,0,.9);z-index:2;opacity:0;transition:opacity .4s}
.tile:hover .tile-tag{opacity:1}
.tile.error{background:rgba(255,255,255,.02)}
.tile.error::after{content:'点击重试';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.lightbox{position:fixed;inset:0;z-index:999;background:rgba(3,4,8,.94);backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s;padding:5vh 5vw}
.lightbox.open{opacity:1;visibility:visible}
.lightbox img{max-width:100%;max-height:78vh;border-radius:14px;box-shadow:0 40px 100px rgba(0,0,0,.8);transform:scale(.94);transition:transform .5s var(--ease);object-fit:contain}
.lightbox.open img{transform:scale(1)}
.lb-close{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(10,11,16,.6);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s}
.lb-close:hover{background:rgba(255,255,255,.12);transform:rotate(90deg)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:1px solid var(--border);background:rgba(10,11,16,.6);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s}
.lb-nav:hover{background:rgba(255,255,255,.14)}
.lb-prev{left:3vw}.lb-next{right:3vw}
.lb-save{position:absolute;bottom:66px;left:50%;transform:translateX(-50%);padding:11px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(10,11,16,.65);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.35s var(--ease);z-index:10}
.lb-save:hover{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#05060a;border-color:transparent}
.lb-save:disabled{opacity:.5;cursor:wait}
.lb-info{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;font-size:12.5px;color:rgba(255,255,255,.6);white-space:nowrap}
@media(max-width:760px){.lb-nav{width:40px;height:40px;font-size:16px}.lb-prev{left:10px}.lb-next{right:10px}.lightbox img{max-height:70vh}.lb-save{bottom:60px;padding:10px 26px;font-size:12.5px}}
.toast{position:fixed;top:100px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:1000;padding:11px 24px;border-radius:999px;background:rgba(10,11,16,.85);border:1px solid var(--border);font-size:13px;color:#fff;opacity:0;pointer-events:none;transition:all .4s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;padding:40px 6vw 60px;color:var(--muted);font-size:12px;line-height:1.9}
footer .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;margin-right:7px;box-shadow:0 0 10px #34d399;animation:bk 2s ease-in-out infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body><div class="aurora"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<header>
  <div>
    <h1><span>ACG WALL</span></h1>
    <p class="sub">10 路动漫图源 · 2K 高清 · 自动重试 · 一键保存</p>
  </div>
  <div class="actions">
    <button class="btn" id="btnRefresh"><span class="spin"></span>换一批</button>
    <button class="btn btn-primary" id="btnFull">全部刷新</button>
  </div>
</header>

<main class="gallery" id="gallery"></main>

<footer>
  <div><span class="dot"></span>10 路图源自动切换 · 点击查看原图</div>
  <div>© 2026 ACG WALL · 仅供学习交流</div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <button class="lb-save" id="lbSave">保存图片</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-info" id="lbInfo"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const COLS = 16;
const MAX_RETRIES = 3;

// 10 路图源（全部改为 2K 高清请求）
const SOURCES = [
  { name: 'LQBBY',     url: 'https://api.lqbby.com/api/pc?return=json', type: 'json' },
  { name: '赫萝',      url: 'https://api.horosama.com/random.php?resolution=2k', type: 'image' },
  { name: 'UApiPro',   url: 'https://uapis.cn/api/v1/random/image?category=acg', type: 'image' },
  { name: '栗次元',    url: 'https://t.alcy.cc/pc', type: 'image' },
  { name: '岁月小筑',  url: 'https://img.xjh.me/random_img.php?ctype=acg&return=302', type: 'image' },
  { name: '小歪',      url: 'https://api.ixiaowai.cn/api/api.php', type: 'image' },
  { name: 'ZHUQIY',    url: 'https://r.zhuqiy.com/', type: 'image' },
  { name: '岁次元',    url: 'https://api.suiciyuan.me/api.php', type: 'image' },
  { name: '极数本源',  url: 'https://v1.apizero.cn/api/wallpaper?category=%E5%8A%A8%E6%BC%AB&resolution=2560x1440&count=1', type: 'json' },
  { name: '樱道',      url: 'https://www.dmoe.cc/random.php', type: 'image' }
];

const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbInfo = document.getElementById('lbInfo');
const toast = document.getElementById('toast');
const btnRefresh = document.getElementById('btnRefresh');
const btnFull = document.getElementById('btnFull');

let images = [];
let lbIndex = 0;

let toastTimer;
function showToast(msg, ms = 2200) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
}

function pickSource() {
  return SOURCES[Math.floor(Math.random() * SOURCES.length)];
}

// 瞬间创建 16 个骨架格子
function createTile(i) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.dataset.index = i;
  tile.innerHTML = `
    <div class="tile-num">${String(i + 1).padStart(2, '0')}</div>
    <div class="tile-tag" data-tag>加载中...</div>
  `;
  gallery.appendChild(tile);
  setTimeout(() => tile.classList.add('show'), i * 20);
  return tile;
}

// 带自动重试的单张加载逻辑
function loadTile(tile, i, retryCount = 0) {
  const oldImg = tile.querySelector('img');
  if (oldImg) oldImg.remove();

  const img = document.createElement('img');
  img.alt = '动漫壁纸 ' + (i + 1);
  img.loading = i < 8 ? 'eager' : 'lazy'; // 前8张急加载，后面懒加载
  img.decoding = 'async';
  tile.insertBefore(img, tile.firstChild);

  const tagEl = tile.querySelector('[data-tag]');
  if (retryCount > 0 && tagEl) {
    tagEl.textContent = `重试中 (${retryCount}/${MAX_RETRIES})`;
    tagEl.style.opacity = '1';
  }

  const source = pickSource();
  const baseUrl = source.url;
  const url = baseUrl + (baseUrl.includes('?') ? '&' : '?') + 't=' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

  let isDone = false;
  const finish = (success) => {
    if (isDone) return;
    isDone = true;
    if (success) {
      img.classList.add('loaded');
      tile.classList.remove('error');
      if (tagEl) {
        tagEl.textContent = source.name;
        tagEl.style.opacity = '';
      }
      images[i] = { url: img.currentSrc || img.src, base: baseUrl, name: source.name };
    } else {
      if (retryCount < MAX_RETRIES) {
        setTimeout(() => loadTile(tile, i, retryCount + 1), 600);
      } else {
        tile.classList.add('error');
        if (tagEl) tagEl.textContent = '失败';
        images[i] = null;
      }
    }
  };

  const timer = setTimeout(() => finish(false), 8000);
  img.onload = () => { clearTimeout(timer); finish(true); };
  img.onerror = () => { clearTimeout(timer); finish(false); };

  if (source.type === 'json') {
    const fetchTimer = setTimeout(() => finish(false), 6000);
    fetch(url)
      .then(res => res.json())
      .then(data => {
        clearTimeout(fetchTimer);
        let imageUrl = null;
        if (data.acgurl) imageUrl = data.acgurl;
        else if (data.url) imageUrl = data.url;
        else if (data.data && data.data[0] && data.data[0].url) imageUrl = data.data[0].url;
        else if (data.imgurl) imageUrl = data.imgurl;
        if (!imageUrl) throw new Error('无图片地址');
        img.src = imageUrl;
      })
      .catch(() => { clearTimeout(fetchTimer); finish(false); });
  } else {
    img.src = url;
  }
}

// 核心逻辑：立刻画出格子，极速异步加载
function loadAll() {
  btnRefresh.classList.add('loading');
  btnRefresh.disabled = true;
  btnFull.disabled = true;

  gallery.innerHTML = '';
  images = [];

  const tiles = [];
  for (let i = 0; i < COLS; i++) {
    tiles.push(createTile(i));
  }

  // 错开 40ms 依次加载，比之前的 150ms 快很多
  tiles.forEach((tile, i) => {
    setTimeout(() => loadTile(tile, i), i * 40);
  });

  // 按钮 2 秒后恢复，不等待所有图片加载完
  setTimeout(() => {
    btnRefresh.classList.remove('loading');
    btnRefresh.disabled = false;
    btnFull.disabled = false;
  }, 2000);
}
</script><script>
/* ========== 灯箱控制 ========== */
function openLightbox(info) {
  lbImg.src = info.url;
  lbInfo.textContent = `${info.name || 'Anime'} · ${lbIndex + 1} / ${COLS}`;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  lbImg.src = '';
}

function navLightbox(dir) {
  for (let step = 0; step < COLS; step++) {
    lbIndex = (lbIndex + dir + COLS) % COLS;
    if (images[lbIndex] && images[lbIndex].url) {
      openLightbox(images[lbIndex]);
      return;
    }
  }
}

/* ========== 保存图片 ========== */
async function saveImage(url, filename) {
  const btn = document.getElementById('lbSave');
  btn.disabled = true;
  btn.textContent = '保存中…';
  showToast('正在准备下载…');
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);
    showToast('已保存到本地');
  } catch (e) {
    window.open(url, '_blank');
    showToast('已打开原图 · 长按或右键保存');
  } finally {
    btn.disabled = false;
    btn.textContent = '保存图片';
  }
}

document.getElementById('lbSave').addEventListener('click', () => {
  const info = images[lbIndex];
  if (!info || !info.url) { showToast('图片还没加载好'); return; }
  const ext = /\.png(\?|$)/i.test(info.url) ? 'png' : 'jpg';
  saveImage(info.url, `anime-${String(lbIndex + 1).padStart(2, '0')}-${Date.now()}.${ext}`);
});

/* ========== 卡片点击 ========== */
gallery.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  const i = +tile.dataset.index;

  if (tile.classList.contains('error')) {
    showToast('重新加载中…');
    tile.classList.remove('error');
    loadTile(tile, i, 0);
    return;
  }

  const info = images[i];
  if (!info || !info.url) { showToast('图片还没加载好'); return; }

  lbIndex = i;
  openLightbox(info);
});

/* ========== 灯箱事件 ========== */
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); navLightbox(-1); });
document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); navLightbox(1); });
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

/* ========== 全局按钮 ========== */
btnRefresh.addEventListener('click', loadAll);
btnFull.addEventListener('click', loadAll);

/* ========== 键盘快捷键 ========== */
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) {
    if (e.key === 'r' || e.key === 'R') loadAll();
    return;
  }
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
  if (e.key === 's' || e.key === 'S') document.getElementById('lbSave').click();
});

/* ========== 启动 ========== */
loadAll();
</script>
</body>
</html>
